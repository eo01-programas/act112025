<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aseguramiento Calidad Textil</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/registro_terceros.css">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <!-- Las librerías CDN (Tailwind, React, Chart.js, etc.) ya no se cargan aquí:
         js/app_bootstrap.js inyecta solo las que necesita la vista actual. -->
</head>
<body data-view="home">
    <script>
    // Instrumentación de rendimiento SOLO para pruebas (?perf=1). TEMPORAL.
    (() => {
        if (!/[?&]perf=1/.test(location.search)) return;
        const mark = (label) => console.log("[PERF] " + label + " " + Math.round(performance.now()) + "ms");
        addEventListener("DOMContentLoaded", () => {
            mark("DOMContentLoaded");
            const root = document.getElementById("root");
            if (!root) return;
            const obs = new MutationObserver(() => {
                if (root.childElementCount > 0) {
                    mark("primer-contenido");
                    obs.disconnect();
                }
            });
            if (root.childElementCount > 0) mark("primer-contenido");
            else obs.observe(root, { childList: true, subtree: true });
        });
        setTimeout(() => {
            const res = performance.getEntriesByType("resource").map(e => ({
                n: e.name.replace(/\?.*$/, "").split("/").slice(-1)[0].slice(0, 42) || e.name.slice(8, 40),
                inicio: Math.round(e.startTime),
                dur: Math.round(e.duration),
                kb: Math.round((e.transferSize || 0) / 1024)
            }));
            console.log("[PERF] recursos " + JSON.stringify(res));
        }, 12000);
    })();
    </script>
    <div id="root"></div>

    <div id="loading-modal" class="app-modal hidden" aria-live="polite" aria-modal="true" role="dialog">
        <div class="app-modal__card">
            <div id="modal-spinner" class="app-modal__spinner">
                <div class="app-modal__spinner-ring"></div>
                <div id="modal-timer" class="app-modal__timer">
                    <span>--</span>
                </div>
            </div>

            <h3 id="modal-title" class="app-modal__title">Cargando...</h3>
            <p id="modal-message" class="app-modal__message">Por favor espere.</p>

            <div class="app-modal__status-box">
                <p id="modal-status" class="app-modal__status">Procesando...</p>
            </div>

            <p id="modal-time-remaining" class="app-modal__time hidden">
                Tiempo estimado: <span id="time-text">--</span>
            </p>

            <button id="modal-close-btn" type="button" class="app-modal__close hidden">
                Cerrar
            </button>
        </div>
    </div>

    <!-- El ?v= evita que el navegador mezcle versiones viejas y nuevas de estos
         archivos. Mantener el valor igual a APP_VERSION en js/config.js. -->
    <script src="js/config.js?v=2026-07-03-8" defer></script>
    <script src="js/data_api.js?v=2026-07-03-8" defer></script>
    <script src="js/router.js?v=2026-07-03-8" defer></script>
    <script src="js/prefetch_calidad.js?v=2026-07-03-8" defer></script>
    <script src="js/menu.js?v=2026-07-03-8" defer></script>
    <script src="js/modal.js?v=2026-07-03-8" defer></script>
    <script src="js/app_bootstrap.js?v=2026-07-03-8" defer></script>
</body>
</html>
