<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aseguramiento Calidad Textil</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/registro_terceros.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-view="home">
    <div id="root"></div>

    <div id="loading-modal" class="app-modal hidden" aria-live="polite" aria-modal="true" role="dialog">
        <div class="app-modal__card">
            <div id="modal-spinner" class="app-modal__spinner">
                <div class="app-modal__spinner-ring"></div>
                <div id="modal-timer" class="app-modal__timer">
                    <span>--</span>
                </div>
            </div>

            <h3 id="modal-title" class="app-modal__title">Cargando...</h3>
            <p id="modal-message" class="app-modal__message">Por favor espere.</p>

            <div class="app-modal__status-box">
                <p id="modal-status" class="app-modal__status">Procesando...</p>
            </div>

            <p id="modal-time-remaining" class="app-modal__time hidden">
                Tiempo estimado: <span id="time-text">--</span>
            </p>

            <button id="modal-close-btn" type="button" class="app-modal__close hidden">
                Cerrar
            </button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/router.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/registro_terceros.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/babel_route_loader.js"></script>
</body>
</html>
